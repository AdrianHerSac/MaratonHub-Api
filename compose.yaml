services:
  maratonhub.api:
    image: maratonhub.api
    build:
      context: .
      dockerfile: MaratonHub.Api/Dockerfile
    ports:
      - "5084:8080"
    depends_on:
      - mongodb
      - redis
    environment:
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}

  redis:
    image: redis:7-alpine
    restart: always
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  redis-data:
